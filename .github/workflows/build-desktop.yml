name: Build Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: vibe-trading-linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: vibe-trading-windows-x86_64
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: vibe-trading-macos-arm64
            ext: ""

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ── Rust toolchain ─────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── System deps (Linux only) ──────────────────────────────
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # ── Node & Frontend ───────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      # ── Tauri CLI ─────────────────────────────────────────────
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      # ── Build ─────────────────────────────────────────────────
      - name: Build Tauri desktop app
        run: |
          cd desktop/src-tauri
          cargo tauri build --target ${{ matrix.target }} --verbose

      # ── Collect artifacts ─────────────────────────────────────
      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p desktop/src-tauri/artifacts
          cp desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb           desktop/src-tauri/artifacts/ 2>/dev/null || true
          cp desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm           desktop/src-tauri/artifacts/ 2>/dev/null || true
          cp desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage desktop/src-tauri/artifacts/ 2>/dev/null || true

      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p desktop/src-tauri/artifacts
          cp -r desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app desktop/src-tauri/artifacts/ 2>/dev/null || true
          cp desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg       desktop/src-tauri/artifacts/ 2>/dev/null || true

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        run: |
          mkdir -p desktop/src-tauri/artifacts
          cp desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe desktop/src-tauri/artifacts/ 2>/dev/null || true
          cp desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi desktop/src-tauri/artifacts/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/src-tauri/artifacts/*
          retention-days: 14

  # ── GitHub Release (main branch only) ────────────────────────
  create-release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Desktop ${{ github.ref_name }}"
          tag_name: "desktop-${{ github.run_number }}"
          files: release-artifacts/**
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
